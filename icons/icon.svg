<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#004b75"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#pondGrad)"/>
  
  <!-- Outer Grid Border -->
  <rect x="56" y="56" width="400" height="400" rx="24" fill="none" stroke="#00d4ff" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>

  <!-- Pond Grid mesh lines -->
  <line x1="56" y1="156" x2="456" y2="156" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
  <line x1="56" y1="356" x2="456" y2="356" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
  
  <line x1="156" y1="56" x2="156" y2="456" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
  <line x1="256" y1="56" x2="256" y2="456" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
  <line x1="356" y1="56" x2="356" y2="456" stroke="#ffffff" stroke-width="4" opacity="0.25"/>

  <!-- Topographic Level / Crosshair -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00ff88" stroke-width="6"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00ff88" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Stadia lines -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="#00ff88" stroke-width="5"/>
  <line x1="256" y1="90" x2="256" y2="422" stroke="#00ff88" stroke-width="5"/>
  
  <!-- Upper & Lower Stadia hairs -->
  <line x1="226" y1="186" x2="286" y2="186" stroke="#00ff88" stroke-width="4"/>
  <line x1="226" y1="326" x2="286" y2="326" stroke="#00ff88" stroke-width="4"/>

  <!-- Harvest Pit / Caja de Pesca icon at lower right node (356, 356) -->
  <rect x="330" y="330" width="52" height="52" rx="10" fill="#ffcc00" stroke="#ffffff" stroke-width="4"/>
  <polygon points="356,342 368,366 344,366" fill="#0a2540"/>

  <!-- Water ripples / flow arrow to drain -->
  <path d="M 180,180 Q 250,220 330,330" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  <polygon points="340,332 320,326 328,310" fill="#00d4ff"/>

  <!-- Center point -->
  <circle cx="256" cy="256" r="8" fill="#ff3366"/>
</svg>